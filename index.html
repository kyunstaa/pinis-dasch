      // Background music - game play
      const bgMusic = new Audio("gameplay.mp3");
      bgMusic.loop = true;
      bgMusic.volume = 0.5;


      // Player
      const p  = 3;
      const ox = 80;
      let oy   = 305;

      let speedY         = 0;
      let jumping        = false;
      let jumpCount      = 0;
      let frame          = 0;
      let groundX        = 0;
      let obstacles      = [];
      let nextObstacleIn = 90;
      let gameOver       = false;
      let score          = 0;
      let highScore      = localStorage.getItem("piniHighScore") ? parseInt(localStorage.getItem("piniHighScore")) : 0;
      let scene          = "title";
      let lastSpawnedType = "";
      
       

      const GROUND = 305;

      function resetGame() {
        gameOver       = false;
        obstacles      = [];
        score          = 0;
        oy             = GROUND;
        speedY         = 0;
        jumping        = false;
        jumpCount      = 0;
        nextObstacleIn = 90;
        frame          = 0;
        groundX        = 0;
      }

      // Input
      document.addEventListener("keydown", (e) => {
        if (e.key !== " " && e.key !== "ArrowUp") return;

        if (scene === "title") {
          scene = "game";
          bgMusic.play();
          return;
        }

        if (gameOver) {
          bgMusic.currentTime = 0;
          bgMusic.play();
          resetGame();
          return;
        }

        if (jumpCount < 2) {
          speedY  = jumpCount === 0 ? -8 : -6;
          jumpCount++;
          jumping = true;
        }
      });

      // Frame data
      const frameData = [
        { x: 100,  w: 85,  h: 85 },
        { x: 480,  w: 90,  h: 90 },
        { x: 700,  w: 130, h: 160 },
        { x: 1000, w: 80,  h: 80 },
      ];

      function drawBackground() {
        ctx.fillStyle = "#f0ece4";
        ctx.fillRect(0, 0, 1000, 350);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 335, 1000, 15);
        ctx.fillStyle = "#ddd8cc";
        ctx.fillRect(0, 348, 1000, 2);

        const scroll = groundX % 1300;
        for (let f of frameData) {
          const fx = ((f.x - scroll) % 1300 + 1300) % 1300;
          const fIdx = frameData.indexOf(f);
          const fy = fIdx === 2 ? 50 : 80;
          
          // Pick which image to show based on frame index
          const frameImages = [frame4Img, frame2Img, frame3Img, frame1Img];
          if (frameImages[fIdx] && frameImages[fIdx].complete && frameImages[fIdx].naturalWidth > 0) {
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(frameImages[fIdx], fx, fy, f.w, f.h);
          } else{
          ctx.fillStyle = "#c8d8e8";
          ctx.fillRect(fx, fy, f.w, f.h);
          ctx.strokeStyle = "#a0b8c8";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(fx, fy); ctx.lineTo(fx + f.w, fy + f.h);
          ctx.moveTo(fx + f.w, fy); ctx.lineTo(fx, fy + f.h);
          ctx.stroke();
          }
        }

        ctx.fillStyle = "#c4956e";
        ctx.fillRect(0, 350, 1000, 50);
        ctx.fillStyle = "#9a6840";
        ctx.fillRect(0, 350, 1000, 2);
      }

      function drawCroc(x, y) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(crocImg, x, y, 40, 40);
      }

      function drawBag(x, y) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(bagImg, x, y, 44, 44);
      }

      function drawMimi(x, y) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(mimiImg, x, y, 112, 64);
      }

      function drawSteve(x, y) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(steveImg, x, y, 90, 90);
      }

      function drawInca(x, y) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(incaImg, x, y, 110, 100);
      }

      function drawPini() {
        const frameIndex = Math.floor(frame / 12) % 2;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
          piniImg,
          frameIndex * FRAME_WIDTH, 0,
          FRAME_WIDTH, FRAME_HEIGHT,
          ox, oy,
          FRAME_WIDTH * 2, FRAME_HEIGHT * 2
        );
      }

      function drawTitleScreen() {
        ctx.fillStyle = "#f0ece4";
        ctx.fillRect(0, 0, 1000, 400);
        ctx.fillStyle = "#c4956e";
        ctx.fillRect(0, 350, 1000, 50);
        ctx.fillStyle = "#9a6840";
        ctx.fillRect(0, 350, 1000, 2);
        drawPini();
        ctx.fillStyle = "#5c3510";
        ctx.font = "50px 'Silkscreen'";
        ctx.textAlign = "center";
        ctx.fillText("Pini's Das(c)h", 500, 150);
        ctx.fillStyle = "#e8395a";
        ctx.font = "20px 'Silkscreen'";
        ctx.fillText("PRESS ANY KEY TO START", 500, 310);
      }

      function drawGameOver() {
        drawBackground();
        for (let ob of obstacles) {
          if (ob.type === "croc") drawCroc(ob.x, ob.y);
          else if (ob.type === "bag") drawBag(ob.x, ob.y);
          else if (ob.type === "mimi") drawMimi(ob.x, ob.y);
          else if (ob.type === "steve") drawSteve(ob.x, ob.y);
          else drawInca(ob.x, ob.y);
        }


        drawPini();
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, 1000, 400);
        ctx.fillStyle = "#ff7420";
        ctx.font = "bold 40px 'Silkscreen'";
        ctx.textAlign = "center";
        ctx.fillText("RUFF DAY FOR PINI", 500, 160);
        ctx.font = "20px 'Silkscreen'";
        ctx.fillText("Score: " + Math.floor(score), 500, 210);
        ctx.fillText("Best:  " + Math.floor(highScore), 500, 245);
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px 'Silkscreen'";
        ctx.fillText("Press Space to restart", 500, 295);
      }

      function gameLoop() {
        console.log("scene:", scene);
        ctx.imageSmoothingEnabled = false;

        if (scene === "title") {
          drawTitleScreen();
          requestAnimationFrame(gameLoop);
          return;
        }
        

        if (gameOver) {
          drawGameOver();
          requestAnimationFrame(gameLoop);
          return;
        }

        frame++;
        const speedMultiplier = score >= 15 ? 1 + Math.min((score - 15)/100, 1.2) : 1;
        groundX += 1.5 * speedMultiplier;

        speedY += 0.2;
        oy     += speedY;
        if (oy >= GROUND) {
          oy      = GROUND;
          speedY  = 0;
          jumping = false;
          jumpCount = 0;
        }

     //Spawn block
        nextObstacleIn--;
        if (nextObstacleIn <= 0) {
          const lastType = lastSpawnedType;
          const noBig = lastType === "mimi" || lastType === "steve" || lastType === "inca";
          const types = noBig ? ["croc", "bag"] : ["croc", "bag", "mimi", "steve", "inca"];
          const type = types[Math.floor(Math.random() * types.length)];
          const isBig = type === "mimi" || type === "steve" || type === "inca";
          const minGap = isBig ? 120 : (lastType === "mimi" || lastType === "steve" || lastType === "inca") ? 120 : 35;
          const scaledMinGap = Math.floor(minGap * speedMultiplier);
          const y = type === "croc" ? 326 : type === "bag" ? 315 : type === "mimi" ? 295 : type === "inca" ? 265 : 278;
          const w = type === "mimi" ? 90 : type === "bag" ? 40 : type === "steve" ? 85 : type === "inca" ? 55 : 34;
          const h = type === "mimi" ? 18 : type === "inca" ? 60 : type === "steve" ? 60 : 20;
          const xOffset = type === "inca" ? 15 : 0;
          obstacles.push({ x: 1020, y: y, w: w, h: h, type: type });
          lastSpawnedType = type;
          const roll = Math.random();
          if (roll < 0.60) {
            nextObstacleIn = isBig ? scaledMinGap : Math.floor(Math.random() * 20) + 75;
          } else if (roll < 0.6) {
            nextObstacleIn = Math.max(scaledMinGap, Math.floor(Math.random() * 60) + 80);
          } else {
            nextObstacleIn = Math.max(scaledMinGap, Math.floor(Math.random() * 80) + 140);
          }
        }

        for (let ob of obstacles) ob.x -= Math.round(2.5 * speedMultiplier);
        obstacles = obstacles.filter(ob => {
          if (ob.x + ob.w < ox && !ob.passed) {
            ob.passed = true;
            score++;
          }
          return ob.x > -50;
        });



        const piniLeft   = ox + 3 * p;
        const piniRight  = ox + 27 * p;
        const piniTop    = oy;
        const piniBottom = oy + 14 * p;
        for (let ob of obstacles) {
          const offset = ob.type === "inca" ? 15 : 0;
          const obLeft = ob.x + offset;
          if (ob.type === "steve" || ob.type === "inca") {
          }
          if (piniRight > obLeft && piniLeft < obLeft + ob.w &&
          piniBottom > ob.y && piniTop < ob.y + ob.h) {
              gameOver = true;
            }
        }

        drawBackground();
        for (let ob of obstacles) {
          if (ob.type === "croc") drawCroc(ob.x, ob.y);
          else if (ob.type === "bag") drawBag(ob.x, ob.y);
          else if (ob.type === "mimi") drawMimi(ob.x, ob.y);
          else if (ob.type === "steve") drawSteve(ob.x, ob.y);
          else drawInca(ob.x, ob.y);
        }


        drawPini();

        if (score > highScore) {
          highScore = score;
          localStorage.setItem("piniHighScore", highScore);
        }
        
        ctx.fillStyle = "#5c3510";
        ctx.font = "bold 15px 'Silkscreen'";
        ctx.textAlign = "left";
        ctx.fillText("Score: " + Math.floor(score), 12, 28);
        ctx.textAlign = "right";
        ctx.fillText("Best: " + Math.floor(highScore), 988, 28);

        requestAnimationFrame(gameLoop);
      }


      document.fonts.ready.then(() => {
        gameLoop();
      });
